<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar - Campeonato Robot One 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .team-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            animation: slideUp 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .team-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .team-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .team-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .score-display {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .score-value {
            font-size: 64px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            min-width: 140px;
        }

        .score-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .score-input {
            width: 80px;
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            color: #333;
            transition: all 0.2s ease;
        }

        .score-input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }

        .btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-minus {
            background: #ff6b6b;
            color: white;
        }

        .btn-minus:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .btn-plus {
            background: #51cf66;
            color: white;
        }

        .btn-plus:hover {
            background: #40c057;
            transform: scale(1.05);
        }

        .btn-reset {
            background: #cccccc;
            color: #333;
            width: 100%;
            margin-top: 10px;
            font-size: 14px;
        }

        .btn-reset:hover {
            background: #b3b3b3;
        }

        .ranking {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.8s ease-out 0.2s backwards;
        }

        .ranking h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
        }

        .ranking-table tr {
            border-bottom: 1px solid #eee;
            transition: background 0.2s ease;
        }

        .ranking-table tr:hover {
            background: #f9f9f9;
        }

        .ranking-table th {
            text-align: left;
            padding: 15px;
            background: #f5f5f5;
            font-weight: bold;
            color: #333;
        }

        .ranking-table td {
            padding: 15px;
            font-size: 16px;
        }

        .position {
            font-weight: bold;
            color: #667eea;
            font-size: 20px;
            width: 50px;
        }

        .medal {
            font-size: 24px;
            margin-right: 10px;
        }

        .position-1 .medal::before {
            content: '🥇';
        }

        .position-2 .medal::before {
            content: '🥈';
        }

        .position-3 .medal::before {
            content: '🥉';
        }

        .global-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn-large {
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            color: white;
        }

        .btn-reset-all {
            background: #ff6b6b;
        }

        .btn-reset-all:hover {
            background: #ff5252;
            transform: scale(1.02);
        }

        .btn-export {
            background: #4c6ef5;
        }

        .btn-export:hover {
            background: #364fc7;
            transform: scale(1.02);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .score-value {
                font-size: 48px;
            }

            .scoreboard {
                grid-template-columns: 1fr;
            }
        }

        .timestamp {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Placar Robot One 2026</h1>
            <p>Campeonato em Tempo Real</p>
        </div>

        <div class="scoreboard" id="scoreboard"></div>

        <div class="ranking">
            <h2>📊 Ranking Geral</h2>
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Equipe</th>
                        <th>Pontuação</th>
                    </tr>
                </thead>
                <tbody id="ranking-body">
                </tbody>
            </table>
        </div>

        <div class="global-controls">
            <button class="btn-large btn-reset-all" onclick="resetAll()">🔄 Resetar Tudo</button>
            <button class="btn-large btn-export" onclick="exportScores()">📥 Exportar Resultados</button>
        </div>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        // Inicializar dados
        const teams = [
            { id: 1, name: 'Equipe 1', score: 0 },
            { id: 2, name: 'Equipe 2', score: 0 },
            { id: 3, name: 'Equipe 3', score: 0 },
            { id: 4, name: 'Equipe 4', score: 0 },
            { id: 5, name: 'Equipe 5', score: 0 }
        ];

        // Carregar dados do localStorage
        function loadScores() {
            const saved = localStorage.getItem('teamsScores');
            if (saved) {
                const data = JSON.parse(saved);
                teams.forEach((team, i) => {
                    if (data[i]) {
                        team.score = data[i].score;
                    }
                });
            }
        }

        // Salvar dados do localStorage
        function saveScores() {
            localStorage.setItem('teamsScores', JSON.stringify(teams));
            updateTimestamp();
        }

        // Atualizar pontuação manual
        function setScore(teamId, value) {
            const team = teams.find(t => t.id === teamId);
            if (team) {
                const score = parseInt(value) || 0;
                team.score = Math.max(0, score);
                saveScores();
                render();
            }
        }

        // Atualizar pontuação
        function updateScore(teamId, delta) {
            const team = teams.find(t => t.id === teamId);
            if (team) {
                team.score = Math.max(0, team.score + delta);
                saveScores();
                render();
            }
        }

        // Resetar tudo
        function resetAll() {
            if (confirm('Tem certeza que quer resetar todas as pontuações?')) {
                teams.forEach(team => team.score = 0);
                saveScores();
                render();
            }
        }

        // Exportar resultados
        function exportScores() {
            const sorted = [...teams].sort((a, b) => b.score - a.score);
            let csv = 'Posição,Equipe,Pontuação\n';
            sorted.forEach((team, i) => {
                csv += `${i + 1},${team.name},${team.score}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `placar-${new Date().toISOString().split('T')[0]}.csv`);
            link.click();
        }

        // Atualizar timestamp
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = 
                `Última atualização: ${now.toLocaleString('pt-BR')}`;
        }

        // Renderizar interface
        function render() {
            renderScoreboard();
            renderRanking();
        }

        // Renderizar placar
        function renderScoreboard() {
            const scoreboard = document.getElementById('scoreboard');
            scoreboard.innerHTML = teams.map(team => `
                <div class="team-card">
                    <div class="team-name">${team.name}</div>
                    <div class="score-display">
                        <div class="score-value">${team.score}</div>
                    </div>
                    <div class="score-controls">
                        <button class="btn btn-minus" onclick="updateScore(${team.id}, -1)">−</button>
                        <input type="number" class="score-input" value="${team.score}" onchange="setScore(${team.id}, this.value)" placeholder="Pontos">
                        <button class="btn btn-plus" onclick="updateScore(${team.id}, +1)">+</button>
                    </div>
                    <button class="btn btn-reset" onclick="if(confirm('Resetar ${team.name}?')) { updateScore(${team.id}, -${team.score}); }">Resetar</button>
                </div>
            `).join('');
        }

        // Renderizar ranking
        function renderRanking() {
            const sorted = [...teams].sort((a, b) => b.score - a.score);
            const tbody = document.getElementById('ranking-body');
            tbody.innerHTML = sorted.map((team, i) => `
                <tr class="position-${i + 1}">
                    <td class="position"><span class="medal"></span>${i + 1}º</td>
                    <td>${team.name}</td>
                    <td><strong>${team.score}</strong></td>
                </tr>
            `).join('');
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            loadScores();
            render();
            // Atualizar timestamp a cada minuto
            setInterval(updateTimestamp, 60000);
            updateTimestamp();
        });

        // Auto-salvar a cada 30 segundos
        setInterval(saveScores, 30000);
    </script>
</body>
</html>
